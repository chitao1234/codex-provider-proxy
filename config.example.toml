# codex-provider-proxy example config
# Set to 0.0.0.0:8080 to accept non-loopback clients (they currently always use default_provider).
# The legacy singular `listen_addr` key is still accepted, but `listen_addrs` supports multiple listeners.
listen_addrs = ["127.0.0.1:8080"]
# Requests must be sent to this path prefix. Example: "/v1" means the proxy accepts /v1/* and forwards only the suffix.
listen_base_path = "/v1"
# Set to a non-loopback address (for example 0.0.0.0:8081) to allow non-loopback RPC clients.
rpc_listen_addr = "127.0.0.1:8081"
# Optional: if set, RPC requires `Authorization: Bearer <rpc_token>` (recommended when exposing RPC beyond localhost)
# rpc_token = "replace-me"
# Bound new upstream connection setup, including TCP connect and TLS handshake, to this many seconds.
# Set to 0 to disable the connect timeout and rely on `upstream_idle_timeout_secs`.
upstream_connect_timeout_secs = 10
# Close proxied connections if upstream sends no data (including response headers/body) for this many seconds.
# The timeout is applied while uploading request bodies and downloading response bodies.
# Set to 0 to disable idle-timeout termination.
upstream_idle_timeout_secs = 120
# Return a local 404 for `/messages/count_tokens` and any path ending with that suffix before
# any upstream forwarding. Query strings do not bypass this check. Set to false to allow the
# endpoint through.
reject_messages_count_tokens = true
# When a `*/responses` SSE stream emits `response.failed` or `error` with an overload code like
# `slow_down` or `server_is_overloaded`, suppress that event and disconnect the client so it can retry.
drop_responses_slow_down_errors = true
# Return upstream HTTP 429 responses to downstream clients as HTTP 503. This is enabled by default.
convert_429_to_503 = true
# Transparent retries for non-2xx upstream responses and pre-downstream upstream send failures.
# Value is the number of additional attempts after the first one (0 disables retries).
# Each retry re-resolves the current provider/default route and rewrites Authorization again.
transparent_retry_count = 0
# HEAD requests remain single-attempt by default even when transparent retries are enabled.
# Set to true to include them in transparent retries.
transparent_retry_head_requests = false
# Linear backoff step between transparent retries, in milliseconds.
# The first retry waits 1x this value, the second waits 2x, and so on. Set to 0 for no delay.
transparent_retry_backoff_step_ms = 0
# Rewrites and transparent retries replay request bodies from memory. Requests larger than this
# limit receive HTTP 413 instead of being buffered without bound.
request_body_buffer_max_bytes = 67108864
default_provider = "provider_a"

[statistics]
# Persistent built-in request, latency, error, traffic, model, client IP, and token metrics.
# Enabled by default even when this section is omitted.
enabled = true
database_path = "./data/statistics.sqlite3"
# Bounded captures used only to identify request models and response token usage.
# Proxy request/response streaming remains unchanged.
request_body_max_bytes = 1048576
response_body_max_bytes = 16777216

# Optional request rewrite layer. It is disabled when no mapping entries are configured.
# Model mappings apply to JSON POST requests whose routed path ends with `responses`, `messages`,
# or `chat/completions`. Matching is exact. `provider` and `from_reasoning_effort` are optional;
# provider-specific and effort-specific mappings take precedence over broader mappings.
#
# `to_model` and `to_reasoning_effort` are optional, but each mapping must set at least one.
# When `to_reasoning_effort` is set, the proxy preserves the request family's effort shape:
# - responses: `reasoning.effort`
# - messages: `output_config.effort`
# - chat completions: `reasoning_effort` unless an existing `reasoning` object is present
# Messages effort rewrites also ensure `anthropic-beta` contains an effort beta marker.
# For Anthropic Messages, `to_model = "claude-sonnet-5[1m]"` keeps body model
# `claude-sonnet-5` and ensures `anthropic-beta` contains a context-1m marker.
#
# [[rewrite.model_mappings]]
# provider = ["provider_a", "provider_b"]
# from_model = ["gpt-5.5", "gpt-5.4"]
# from_reasoning_effort = "xhigh"
# to_model = "grok-4.5"
# to_reasoning_effort = "high"

[logging]
level = "info"
# Optional extra tracing filter directives appended after `level`.
# rule = "codex_provider_proxy=debug,hyper=warn"
log_requests = true
log_responses = true
log_bodies = false
max_body_log_bytes = 8192
# Optional: when set, writes per-exchange files under this directory
# (metadata plus exchange-level and per-attempt headers/request bodies/response bodies).
# exchange_log_dir = "./logs/exchanges"
# Optional cap for exchange request/response body files. 0 means unlimited.
exchange_body_max_bytes = 0
# Compression for exchange request/response body files: "none" or "zstd".
exchange_body_compression = "none"
# Best-effort reconstruction for URLs ending in `responses` or `messages`, and `/chat/completions`.
# This only affects file output and never alters proxy behavior.
reconstruct_responses = true

[providers.provider_a]
base_url = "https://api.example.com/"
api_key = "replace-me"

[providers.provider_b]
base_url = "https://api.other.example/"
api_key = "replace-me"
# You can override the full Authorization header value if you don't want Bearer auth:
# authorization_header = "Api-Key replace-me"

# Optional API format conversion (per provider). Providers without these fields proxy
# transparently, exactly as before.
#
# `upstream_api` declares the dialect the provider speaks. Supported: "passthrough"
# (default) and "openai_chat_completions".
#
# `accept_downstream_apis` lists downstream dialects to convert FROM. Supported:
# "anthropic_messages" (Claude Code's Messages API). When set, POST /v1/messages requests
# are converted to POST /chat/completions, and responses are converted back.
#
# `capabilities` sets provider-level conversion defaults; `models."<model>"` overrides them
# per upstream model name (matched after [[rewrite.model_mappings]] rewrites). Available
# knobs and defaults:
#   max_tokens_field = "max_tokens"        # or "max_completion_tokens" (OpenAI official)
#   thinking_param = "top_level"           # "top_level" (DeepSeek) or "none" (OpenAI/Grok)
#   reasoning_effort = { enabled = true, levels = ["low","medium","high","xhigh","max"], default = null }
#   server_tools = "drop"                  # "drop" | "map_to_function" | "passthrough"
#   image_input = false
#   parallel_tool_calls = true
#   response_format = "json_object"        # "text" | "json_object" | "json_schema"
#   stream_include_usage = true
#
# [providers.chat_provider]
# base_url = "https://api.deepseek.com/"
# api_key = "replace-me"
# upstream_api = "openai_chat_completions"
# accept_downstream_apis = ["anthropic_messages"]
#
# [providers.chat_provider.capabilities]
# max_tokens_field = "max_tokens"
# thinking_param = "top_level"
# reasoning_effort = { enabled = true, levels = ["low", "high", "max"], default = "high" }
# server_tools = "drop"
#
# [providers.chat_provider.models."deepseek-v4-pro"]
# image_input = false
